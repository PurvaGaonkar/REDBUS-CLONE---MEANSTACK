  <!-- Navbar Right Part -->
  <div class="flex flex-wrap items-center gap-3">

    <!-- Google Login -->
    <div id="google-btn" *ngIf="!isloggedIn"></div>

    <!-- Logged-in Menu -->
    <div
      class="hidden md:flex items-center gap-3"
      *ngIf="isloggedIn"
    >
      <a
        class="flex items-center justify-center gap-2 h-10 px-2 rounded-lg hover:bg-gray-100"
      >
        <i class="fa-solid fa-headset text-[#4a4a4a] text-xl"></i>
        <p>Help</p>
      </a>

      <button
        class="flex items-center justify-center gap-2 h-10 px-2 rounded-lg hover:bg-gray-100"
        [matMenuTriggerFor]="menu"
      >
        <i class="fa-regular fa-user text-[#4a4a4a] text-xl"></i>
        <p>Account</p>
        <i class="fa-solid fa-angle-down text-[#4a4a4a] text-xl"></i>
      </button>

      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="navigate('/my-trips')">
          {{ 'NAVBAR.MY_TRIPS' | translate }}
        </button>

        <button mat-menu-item>
          Wallet/Cards
        </button>

        <button mat-menu-item (click)="navigate('/profile')">
          {{ 'NAVBAR.PROFILE' | translate }}
        </button>

        <button mat-menu-item>
          Wallet
        </button>

        <button mat-menu-item (click)="handlelogout()">
          {{ 'NAVBAR.LOGOUT' | translate }}
        </button>
      </mat-menu>
    </div>

    <!-- Travel Community -->
    <a
      routerLink="/community"
      class="px-2 py-2 rounded-lg hover:bg-gray-100"
    >
      {{ 'NAVBAR.COMMUNITY' | translate }}
    </a>

    <!-- Language Selector -->
    <div class="flex items-center gap-2">
      <label
        for="language"
        class="text-gray-700 whitespace-nowrap"
      >
        {{ 'NAVBAR.LANGUAGE' | translate }}
      </label>

      <select
        id="language"
        class="border border-gray-300 rounded-md px-2 py-2 bg-white text-gray-800 outline-none focus:ring-2 focus:ring-green-500"
        [value]="selectedLanguage"
        (change)="changeLanguage($any($event.target).value)"
        aria-label="Select language"
      >
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="mr">मराठी</option>
      </select>
    </div>

  </div>
</nav>

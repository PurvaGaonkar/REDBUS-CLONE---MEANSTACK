
<header class="site-header">
  <div class="navbar-container">

    <!-- Brand -->
    <a class="brand" routerLink="/" aria-label="TEDBUS home">
      <img
        class="brand-logo"
        src="assets/red-bus-with-word-bus-it_600323-482.avif"
        alt="TEDBUS"
      />
      <span class="brand-name">TED<span>BUS</span></span>
    </a>

    <div class="nav-divider"></div>

    <!-- Main navigation -->
    <nav class="main-nav" aria-label="Main navigation">
      <button
        type="button"
        class="nav-link"
        (click)="navigate('/cab-rental')"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 11l1.5-4h11l1.5 4" />
          <rect x="3" y="11" width="18" height="7" rx="2" />
          <path d="M6 18v2m12-2v2M6 14h2m8 0h2" />
        </svg>
        <span>{{ 'NAV.CAB_RENTAL' | translate }}</span>
      </button>

      <button
        type="button"
        class="nav-link"
        (click)="navigate('/train-tickets')"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="2" width="14" height="17" rx="4" />
          <path d="M8 6h8M8 11h.01M16 11h.01M8 19l-3 3m11-3 3 3M8 15h8" />
        </svg>
        <span>{{ 'NAV.TRAIN_TICKETS' | translate }}</span>
      </button>
    </nav>

    <!-- Right-side actions -->
    <div class="navbar-actions">

      <!-- Theme toggle -->
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-pressed]="themeService.theme === 'dark'"
        [attr.aria-label]="
          themeService.theme === 'dark'
            ? 'Switch to light mode'
            : 'Switch to dark mode'
        "
      >
        <svg
          *ngIf="themeService.theme === 'light'"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
        </svg>

        <svg
          *ngIf="themeService.theme === 'dark'"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l-1.42-1.42m11.3-11.3 1.42-1.42" />
        </svg>

        <span>
          {{
            (themeService.theme === 'dark'
              ? 'NAV.LIGHT_MODE'
              : 'NAV.DARK_MODE') | translate
          }}
        </span>
      </button>

      <!-- Google Sign-In -->
      <div
        *ngIf="!isloggedIn"
        id="google-btn"
        class="google-signin"
      ></div>

      <!-- Logged-in user -->
      <div *ngIf="isloggedIn" class="user-actions">
        <span class="signed-in-label">
          {{ 'NAV.SIGNED_IN' | translate }}
        </span>

        <button
          type="button"
          class="sign-out-button"
          (click)="handlelogout()"
        >
          {{ 'NAV.SIGN_OUT' | translate }}
        </button>
      </div>

      <!-- Language selector -->
      <div class="language-wrapper">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
        </svg>

        <select
          class="language-select"
          [value]="selectedLanguage"
          (change)="changeLanguage($any($event.target).value)"
          [attr.aria-label]="'NAV.LANGUAGE' | translate"
        >
          <option
            *ngFor="let language of languages"
            [value]="language.code"
          >
            {{ language.name }}
          </option>
        </select>
      </div>

    </div>
  </div>
</header>
